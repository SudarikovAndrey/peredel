.pats{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 8px}
.pchip{background:#1a4530;border:1px solid #2d6b48;border-radius:6px;padding:2px 6px;font-size:12px;font-weight:600;color:#dff0e5}
.pchip i{font-style:normal;color:#f2b632}
.pchip.on{background:#123020;border-color:#3f8f4c}
.pchip.hurt{background:#3a2420;border-color:#7a4a3a;opacity:.6}
.pats i{color:#5f7a68;font-size:12px}
:root{--disp:'Druk Cyr',Impact,'Arial Black',sans-serif;--bg:#0d2417;--panel:#123020;--cream:#efe4cc;--cream2:#e3d6b8;--ink:#2a221c;--mut:#5f7a68;--red:#c9432f;--red2:#a83422;--green:#3f8f4c;--gold:#e0a52a;--line:#d6c8a8;--txt:#efe4cc}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.35 'Suisse Intl',-apple-system,Segoe UI,Roboto,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;width:100%;margin:0 auto;position:relative}
#top>*{width:100%;max-width:520px}
#top,#panel,#inv,#tip,#toast{zoom:var(--ui,1)}.nozoom #top,.nozoom #panel,.nozoom #inv,.nozoom #tip,.nozoom #toast{zoom:1}
.card{zoom:1}
#toast .tico{width:44px;height:44px;border-radius:12px;background:#2a221c14;display:flex;align-items:center;justify-content:center;font-size:26px;flex:0 0 auto}#toast .ttxt{flex:1;min-width:0;text-align:left}
#top{position:absolute;left:0;right:0;top:0;z-index:35;padding:4px 8px 0;display:flex;flex-direction:column;gap:3px;pointer-events:none;align-items:center}
.bar0{display:flex;gap:8px;align-items:center;justify-content:center;width:100%}
.ava{display:flex;flex-direction:column;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:var(--cream);color:var(--ink);border:3px solid #8a7e6e;padding:0;line-height:1;box-shadow:0 2px 0 #0004}
.ava span{font-size:20px}.ava small{font-size:9px;font-weight:800}
.round{width:32px;height:32px;border-radius:50%;background:var(--cream);color:var(--ink);padding:0;font-size:20px;font-weight:800;box-shadow:0 2px 0 #0004;margin-left:auto}
.cur .ic{width:32px;height:32px;border-radius:0;display:inline-flex;align-items:center;justify-content:center;font-size:15px;color:#fff;font-weight:900;padding:0;background:#555;flex:0 0 auto}
.cur .ic.g{background:#3f8f4c}.cur .ic.b{background:#3e5a8a}.cur .ic.o{background:#e0902a}
.qchip{position:relative;overflow:hidden;background:#2b2723e6;color:var(--cream);border:0;border-radius:8px;padding:4px 6px 6px;font-size:11px;font-weight:700;box-shadow:none;text-align:center;line-height:1.15;min-height:36px;display:flex;align-items:center;justify-content:center}
.qchip i{position:absolute;left:0;bottom:0;height:3px;background:var(--green);width:0}
.qchip.done{background:var(--green);color:#fff}
.qchip.dark{font-weight:600}
.qchip.done i{display:none}
.qchip[hidden]{display:none}
#top>*{pointer-events:auto}
.bar1,.bar2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;align-items:stretch}
.warbar{position:relative;width:100%;max-width:520px;height:17px;border-radius:11px;overflow:hidden;
  background:linear-gradient(90deg,#c9432f,#8d3320);box-shadow:0 2px 0 #0004;pointer-events:none}
.warbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#3f8f4c,#2a6135);transition:width .4s ease}
.warbar em{position:absolute;top:0;bottom:0;display:flex;align-items:center;font-style:normal;font-size:10px;font-weight:800;color:#fff;text-shadow:0 1px 2px #0008;padding:0 8px}
.warbar em.me{left:0}.warbar em.them{right:0}
.bodybar{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:520px;
  padding:0 8px;font-size:12px;font-weight:800;color:var(--cream);text-shadow:0 1px 2px #0008}
.bodybar .side{display:flex;align-items:center;gap:4px}
.bodybar .side.me b{color:#8fe0a2}.bodybar .side.them b{color:#ffb3a6}
.bodybar em{font-style:normal;font-size:12px;opacity:.85}
.bodybar em.dead{opacity:.6}
.bodybar .mid{font-size:9px;font-weight:600;opacity:.55;text-transform:uppercase;letter-spacing:.04em}
.bodybar b{transition:transform .18s ease,color .18s ease;display:inline-block}
.bodybar b.up{animation:bBump .6s ease}
.bodybar b.down{animation:bDrop .6s ease}
@keyframes bBump{0%{transform:scale(1)}30%{transform:scale(1.5);color:#8fe0a2}100%{transform:scale(1)}}
@keyframes bDrop{0%{transform:scale(1)}30%{transform:scale(1.5);color:#ff7a68}100%{transform:scale(1)}}
.warbar b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;text-shadow:0 1px 3px #000a}

function zoneOf(i){return CFG.ZONES.findIndex(z=>i>=z.from&&i<=z.to);}
// раскладка района 0 из Maps.json `[код]`: X хата · T точка · B бизнес · S склад
// C Кулак · F драка · GM бабка · J тюрьма
const CORE_MAP=CORE10.map.split(',').map(v=>v.split('_')[0]);
// хата и драки убраны: круг закрывается проходом нулевой клетки, а освободившееся
// отдано под шанс и миниигры. Кулаков остаётся 4, как в коре
const CODE2TYPE={X:'mini',T:'kiosk',B:'biz',S:'wh',C:'chance',F:'luck',GM:'pot',J:'police'};
const HOSPITAL_AT=3;                 // какой по счёту склад становится госпиталем — тип Hospital есть в ETileType кора `[код]`
const MINI_AT=new Set([1,6]);        // и какие два — минииграми: своих клеток в раскладке кора нет, режем излишек складов
const F_ORDER=['luck','luck','luck','luck']; // четыре бывшие клетки драки — под шанс; нулевая клетка под миниигру
// точка и бизнес берут свои числа прямо из строки конфига кора
function buildTiles(){
  const ids=CORE10.map.split(','), t=[]; let pi=0, bi=0, fi=0, si=0;
  for(let i=0;i<40;i++){
    const code=ids[i].split('_')[0], z=zoneOf(i);
    let o={i,code,cid:ids[i],type:CODE2TYPE[code],zone:z,owner:null,level:0,capLvl:1,salesLvl:1,goods:0,tier:1,guards:[]};
    if(code==='F'){o.type=F_ORDER[fi++%F_ORDER.length];}
    if(code==='S'){ const n=si++; if(n===HOSPITAL_AT)o.type='hospital'; else if(MINI_AT.has(n))o.type='mini'; }
    if(o.type==='kiosk'){o.cfg=CORE10.points[pi++%CORE10.points.length];o.price=o.cfg.cost;o.price0=o.price;o.good=o.cfg.good;o.base=o.good;}
    else if(o.type==='biz'){o.cfg=CORE10.biz[bi++%CORE10.biz.length];o.price=Math.round(o.cfg.cost*CFG.BIZ_PRICE_K/10)*10;o.price0=o.price;o.level=1;}
    else o.zone=-1;
    t.push(o);
  }
  return t;
}

const QTEXT={sell:g=>`Продай ${g} шт`,buy:g=>`Возьми ${g} ${g===1?'точку':'точки'}`,upg:g=>`Прокачай ${g} раз`,parcel:g=>`—`,earn:g=>`Заработай ₽${g}`};
function newQuest(){
  const L=CFG.QUEST_LADDER[Math.min(S.day,CFG.QUEST_LADDER.length)-1];
  const mk=(q,rw)=>({id:q.id,goal:q.goal,text:QTEXT[q.id](q.goal),prog:0,done:false,claimed:false,reward:rw});
  S.q=[mk(L.easy,CFG.QUEST_EASY_REWARD),mk(L.hard,L.reward)];
}
function qProg(id,n,max){if(!S.q)return;for(const q of S.q){if(q.id!==id||q.done)continue;q.prog=max?Math.max(q.prog,n):q.prog+n;if(q.prog>=q.goal){q.done=true;toast(`🎯 «${q.text}» выполнено — награда в 🎫`);}}}
const rwText=r=>r.rolls?'+'+r.rolls+' ходов':r.hard?'+$ '+r.hard:'+$'+r.cash;
async function questClick(){
  if(!S.q)return;
  const ready=S.q.filter(q=>q.done&&!q.claimed);
  if(ready.length){for(const q of ready){const r=q.reward;if(r.rolls)S.rolls+=r.rolls;if(r.cash)S.cash+=r.cash;q.claimed=true;log(`🎯 Награда за «${q.text}»: ${rwText(r)}.`);}toast('Награда получена');save();render();return;}
  await modal(`<h2>🎯 Задания дня</h2>`+S.q.map((q,i)=>`<div class="row"><span class="n">${i?'🔥 ':''}${q.text}<small>${i?'сложное':'разогрев'} · награда ${rwText(q.reward)}</small></span><span class="v">${q.claimed?'✓':Math.min(q.prog,q.goal)+'/'+q.goal}</span></div>`).join('')+`<p>Линейка одна для всех игроков и растёт по дням. Незабранная награда сгорает в полночь.</p>`,[{t:'Ок',v:1}]);
}

// ---------- ПЕРЕДЕЛ: тела, банда, стычки ----------
const NAMES=['Гиря','Клещ','Тюлень','Профессор','Шуруп','Батон','Мотыль','Хорёк','Лом','Валет','Штырь','Гвоздь','Пузырь','Кабан','Дизель','Тапок','Циркуль','Кощей','Сивый','Жук','Крот','Ржавый','Барон','Чиж','Митёк','Утюг','Пельмень','Фитиль','Балда','Пыж','Сохатый','Бубен'];
const BAND_NAMES=['Залётные','Люберецкие','Тамбовские','Ореховские','Кунцевские'];
const MODS=[
  {id:'obl',name:'Облава',        txt:'Крупнейший владелец платит 3% нала каждый круг'},
  {id:'gre',name:'Жадный район',  txt:'Рента ×3 вместо ×2 у обеих сторон'},
  {id:'mem',name:'Долгая память', txt:'Лазарет вдвое дольше'},
  {id:'sht',name:'Сжатый срок',   txt:'Забег вдвое короче'},
  {id:'nav',name:'Наводка',       txt:'Точки банды без охраны подсвечены'},
  {id:'wkd',name:'Выходные',      txt:'Сборы на последнем круге удваиваются'},
];
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rndi=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const hasMod=m=>S&&S.mods&&S.mods.includes(m);
const runLaps=()=>S.runLaps||CFG.RUN_LAPS;
const lazTime=()=>CFG.LAZARET*(hasMod('mem')?2:1);
const rentMult=()=>hasMod('gre')?3:CFG.RENT_MULT;
// рента = доля от круговой выручки точки: сбор в коре мелкий, а зарабатывает точка продажами
function rentOf(t){
  if(t.type==='biz')return Math.round(fee(t)*rentMult());
  const m=Math.max(0,sellPrice(t.good)-buyPrice(t.good));
  const turnover=Math.round(sales(t)*m*monoMult(t.owner,t.good));
  return Math.max(1,Math.round((fee(t)+turnover*CFG.RENT_OF_TURNOVER)*rentMult()/2));
}
function makePatsan(nm,lvl){const rank=lvl>=25?3:lvl>=16?2:1;return{name:nm,lvl,rank,power:Math.round(lvl*(1+rank*0.25)),where:null,hurt:0};}
function makeCollection(){const c=CFG.COLLECTION,ns=NAMES.slice().sort(()=>Math.random()-0.5);
  return Array.from({length:c.count},(_,i)=>makePatsan(ns[i%ns.length]+(i>=ns.length?' мл.':''),rndi(c.lvlMin,c.lvlMax)));}
function makeBand(mine){const ns=NAMES.slice().sort(()=>Math.random()-0.5);
  return mine.map(p=>p.lvl).sort((a,b)=>b-a).map((lvl,i)=>makePatsan(ns[i%ns.length],Math.max(1,Math.round(lvl*CFG.BAND_MIRROR))));}
const freeBodies=side=>side.pat.filter(p=>!p.where&&!p.hurt);
const powerOf=list=>list.reduce((a,p)=>a+p.power,0);
const guardPower=t=>powerOf(t.guards||[]);
// слотов охраны тем больше, чем выше уровень точки: 1 на старте, 5 на максимуме
// бизнес силой не берут, поэтому и охранять его нечем
const guardMax=t=>t.type==='biz'?0:Math.max(1,Math.min(CFG.GUARD_MAX,1+Math.floor(klevel(t)/CFG.GUARD_PER_LEVEL)));
// вложено в объект: покупка плюс все прокачки — от этой суммы считается перекуп
const invested=t=>t.invested||t.price;
const buyoutPrice=t=>Math.round(invested(t)*CFG.BUYOUT_MARKUP/10)*10;
// соседи справа и слева, если они твои, присылают часть своей охраны
function neighborHelp(t){
  if(!t.owner)return 0;
  let sum=0;
  for(const d of [-1,1]){const n=S.tiles[(t.i+d+40)%40]; if(n.owner===t.owner)sum+=guardPower(n);}
  return Math.round(sum*CFG.NEIGHBOR_HELP);
}
const defPower=t=>guardPower(t)+neighborHelp(t);
const defList=t=>[{power:defPower(t)}];
// хватает ли денег и тел, чтобы на этой клетке что-то сделать — от этого цвет кнопки
function tileCan(t){
  const mx=t.cfg?t.cfg.upg:11;
  if(t.type==='kiosk'||t.type==='biz'){
    if(!t.owner)return S.cash>=t.price;
    if(!isMine(t))return false;
    const canUp=t.type==='kiosk'
      ? (t.capLvl<mx&&S.cash>=capCost(t))||(t.salesLvl<mx&&S.cash>=salesCost(t))
      : (t.level<mx&&S.cash>=bizUpCost(t));
    const canGuard=freeBodies(S).length>0&&(t.guards||[]).length<guardMax(t);
    return canUp||canGuard;
  }
  if(t.type==='wh')return myKiosks().some(x=>x.goods<cap(x)&&S.cash>=buyPrice(x.good));
  return false;
}
// монополия по категории: чем больше точек одного товара, тем дороже уходит каждая штука
// досрочная победа: либо все бизнесы раскачаны, либо две категории целиком
function dominance(side){
  const D=CFG.DOMINANCE;
  const biz=S.tiles.filter(t=>t.type==='biz'&&t.owner===side&&unlocked(t));
  if(biz.length>=D.biz&&biz.every(t=>t.level>=D.bizLevel))return{kind:'biz',txt:`${D.biz} бизнеса до ур. ${D.bizLevel}`};
  let full=0;
  for(const g of CORE10.goods){

// ---------- бой как в коре: EHP и EDPS, дуэли строго один на один ----------
// Power пацана = (EHP + EDPS)/10, поэтому раскладываем силу обратно на две величины
const EDPS=p=>Math.max(1,p.power*10*CFG.EDPS_SHARE);
const EHP =p=>Math.max(1,p.power*10*(1-CFG.EDPS_SHARE));
// Очередь на очередь: дерутся всегда двое. Кто упал — на его место выходит следующий,
// уцелевший остаётся с тем здоровьем, что у него осталось. Крепкий защитник может
// перемолоть всю пятёрку в одиночку
function duelChain(att,def,defended){
  const k=defended?CFG.DEF_BONUS:1;
  const A=att.map(p=>({p,hp:EHP(p),dps:EDPS(p)}));
  const B=def.map(p=>({p,hp:EHP(p)*k,dps:EDPS(p)}));
  const deadA=[],deadB=[]; let i=0,j=0,guard=0;
  while(i<A.length&&j<B.length&&guard++<400){
    const a=A[i],b=B[j];
    const da=a.dps*fightNoise(), db=b.dps*fightNoise();
    const ta=b.hp/da, tb=a.hp/db;        // кому сколько секунд до победы
    if(ta<=tb){ a.hp-=db*ta; b.hp=0; deadB.push(b.p); j++; }
    else      { b.hp-=da*tb; a.hp=0; deadA.push(a.p); i++; }
  }
  return {attWin:j>=B.length, deadA, deadB, leftA:A.length-i, leftB:B.length-j};
}
// шанс считаем прогоном модели — формулой такую цепочку не выразить
function duelOdds(att,def,defended,n){
  n=n||160; let w=0;
  for(let k=0;k<n;k++) if(duelChain(att,def,defended).attWin) w++;
  return Math.max(CFG.FIGHT_FLOOR,Math.min(1-CFG.FIGHT_FLOOR,w/n));
}

// а потолок и пол не дают ни одной стороне стать неуязвимой
function fightNoise(){return 1+(Math.random()*2-1)*CFG.FIGHT_NOISE;}
// defended=true только там, где вторая сторона реально держит точку: наезд на охрану.
// На стрелке и в драке со шпаной бонуса обороны нет — там встречный бой
function fightOdds(att,def,defended){
  const k=defended?CFG.DEF_BONUS:1;
  const pa=Math.pow(Math.max(1,powerOf(att)),CFG.RAID_STEEP);
  const pb=Math.pow(Math.max(1,powerOf(def)*k),CFG.RAID_STEEP);
  return Math.max(CFG.FIGHT_FLOOR,Math.min(1-CFG.FIGHT_FLOOR,pa/(pa+pb||1)));
}
function fightRoll(att,def,defended){
  const k=defended?CFG.DEF_BONUS:1;
  const pa=Math.pow(Math.max(1,powerOf(att)*fightNoise()),CFG.RAID_STEEP);
  const pb=Math.pow(Math.max(1,powerOf(def)*k*fightNoise()),CFG.RAID_STEEP);
  const p=Math.max(CFG.FIGHT_FLOOR,Math.min(1-CFG.FIGHT_FLOOR,pa/(pa+pb||1)));
  return Math.random()<p;
}

function stashOf(side){S.stash=S.stash||{you:{},band:{}};return S.stash[side];}
function grab(t,to){
  const prev=t.owner;
  if(S.diag){ if(to==='you'&&prev==='band')S.diag.grabMe++; else if(to==='band'&&prev==='you')S.diag.grabBand++; }
  if(prev&&t.type==='kiosk'&&t.goods>0){

    if(prev==='you')log(`Товар с ${name(t)} (${t.goods} шт) забрал с собой — в захват он не идёт.`);
    t.goods=0;
  }
  dropGuards(t); t.owner=to;   // охрану новый хозяин ставит сам — сама она не появляется
}
// разложить загашник обратно по своим точкам, где есть место
function unstash(side){
  const st=stashOf(side), tiles=S.tiles.filter(t=>t.type==='kiosk'&&t.owner===side&&unlocked(t));
  let back=0;
  for(const g of Object.keys(st)){
    let n=st[g]; if(n<=0){delete st[g];continue;}
    for(const t of tiles.filter(t=>t.good===g).sort((a,b)=>sales(b)-sales(a))){
      const room=cap(t)-t.goods; if(room<=0)continue;
      const put=Math.min(room,n); t.goods+=put; n-=put; back+=put; if(n<=0)break;
    }
    if(n>0)st[g]=n; else delete st[g];
  }
  if(back&&side==='you')log(`Из загашника вернулось на точки: ${back} шт.`);
  return back;
}

  if(S.pos===S.band.pos) await meeting(total);   // сошлись на одной клетке

}
const ease={lin:p=>p,in:p=>p*p,out:p=>1-(1-p)*(1-p),one:p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2};
// длительности клеток берём из одной общей кривой разгон-торможение:
// внутри клетки движение равномерное, а стыков со скачком скорости не остаётся
const easeInOut=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
function cellDurations(n,totalMs){
  const t=[];
  for(let k=0;k<=n;k++){
    const target=k/n; let lo=0,hi=1;
    for(let it=0;it<26;it++){const mid=(lo+hi)/2; if(easeInOut(mid)<target)lo=mid; else hi=mid;}
    t.push((lo+hi)/2*totalMs);
  }
  return Array.from({length:n},(_,k)=>Math.max(40,t[k+1]-t[k]));
}
function step(from,to,ms,kind){if(CFG.SPEED>=100)return Promise.resolve();return new Promise(res=>{
  const a={from,to,t0:performance.now(),ms:ms/CFG.SPEED,kind,res,done:false};anim=a;kick();
  // страховка: если кадры не тикают (вкладка в фоне), шаг всё равно завершится
  setTimeout(()=>{if(anim===a&&!a.done){a.done=true;a.p=1;res();}},a.ms+60);
});}
function kick(){if(!looping){looping=true;requestAnimationFrame(loop);}}
function loop(now){
  if(anim&&!anim.done){let p=Math.min(1,(now-anim.t0)/anim.ms);anim.p=ease[anim.kind](p);if(p>=1){anim.done=true;anim.p=1;anim.res();}}
  draw();
  for(const f of flyers){f.p=Math.min(1,(now-f.t0)/f.ms);if(f.p>=1&&!f.done){f.done=true;f.onDone&&f.onDone();}}
  flyers=flyers.filter(f=>!f.done);
  if((anim&&!anim.done)||bAnim||floats.length||camMoving||flyers.length)requestAnimationFrame(loop); else looping=false;
}

function bandPlan(){

let bAnim=null;
function bandStep(ms){
  if(S.bandLeft<=0)return;
  const from=S.band.pos;
  S.bandLeft--; S.band.pos=(from+1)%40;
  if(!S.fast){bAnim={from,to:S.band.pos,t0:performance.now(),ms:Math.max(30,(ms||CFG.MOVE_MS)/CFG.SPEED)};kick();}
  if(S.band.pos===0) bandLapDone();

// у банды та же петля, что у игрока: сборы, продажа товара, закупка, прокачка, охрана
function bandLapDone(){
  unstash('band');
  const mine=bandTiles(), ks=mine.filter(t=>t.type==='kiosk');
  // сборы уже начислены при проходе по своим клеткам — как у игрока
  // продажа со своих точек
  for(const t of ks){const n=Math.min(sales(t),t.goods);if(n>0){t.goods-=n;S.band.cash+=Math.round(n*sellPrice(t.good)*monoMult('band',t.good));}}
  // прокачка: самое дешёвое, что по карману
  let u=0;
  while(u++<20){
    const opts=[];
    for(const t of mine){const mx=t.cfg?t.cfg.upg:11;
      if(t.type==='kiosk'){if(t.capLvl<mx)opts.push({t,k:'cap',c:capCost(t)});if(t.salesLvl<mx)opts.push({t,k:'sal',c:salesCost(t)});}
      else if(t.level<mx)opts.push({t,k:'biz',c:bizUpCost(t)});}
    const free=S.tiles.some(t=>!t.owner&&(t.type==='kiosk'||t.type==='biz'));
    const keep=BOT.reserve+(free?BOT.keepForTile:0);
    const best=opts.filter(o=>S.band.cash-o.c>=keep).sort((a,b)=>a.c-b.c)[0];
    if(!best)break;
    S.band.cash-=best.c; best.t.invested=invested(best.t)+best.c;
    if(best.k==='cap')best.t.capLvl++;else if(best.k==='sal')best.t.salesLvl++;else best.t.level++;
  }
  botGuards('band');
}
function bandStock(){ // банда закупается там же, где игрок — на складе
  const SIDE='band'; const ks=bandTiles().filter(t=>t.type==='kiosk');
  let g=0;
  while(g++<400){
    const free=ks.filter(t=>t.goods<cap(t)).sort((a,b)=>(sellPrice(b.good)*monoMult(SIDE,b.good)-buyPrice(b.good))-(sellPrice(a.good)*monoMult(SIDE,a.good)-buyPrice(a.good)));
    if(!free.length)break;
    const t=free[0], p=buyPrice(t.good);
    if(S.band.cash-p<BOT.reserve*0.2)break;
    S.band.cash-=p; t.goods++;
  }
}

// ---------- клетка «Госпиталь»: поднимает весь лазарет разом ----------
async function hospital(){
  const fallen=S.pat.filter(p=>p.hurt);
  if(S.fast){ fallen.sort((a,b)=>b.power-a.power).slice(0,CFG.HOSPITAL_HEAL).forEach(p=>p.hurt=0); return; }
  if(!fallen.length){
    await modal(`<h2>🏥 Госпиталь</h2><p class="t">Поднимать некого — все на ногах.</p>`,[{t:'И ладно',v:1,cls:'sec'}]);
    return;
  }
  let pick=fallen.slice().sort((a,b)=>b.power-a.power).slice(0,CFG.HOSPITAL_HEAL);
  const done=openCustom();
  const paint=()=>{
    const sort=S.patSort||'power';
    const list=fallen.map(p=>({p,i:S.pat.indexOf(p)}))
      .sort((a,b)=>{
        const r=x=>pick.includes(x.p)?0:1;
        if(r(a)!==r(b))return r(a)-r(b);
        if(sort==='rank'&&a.p.rank!==b.p.rank)return b.p.rank-a.p.rank;
        if(sort==='new')return b.i-a.i;
        return b.p.power-a.p.power;
      });
    $('modal').classList.add('mid'); $('card').className='card';
    $('card').innerHTML=`<h2>🏥 Госпиталь</h2>
      <p class="t">Подлатают ${CFG.HOSPITAL_HEAL} на выбор — остальные долежат своё.</p>
      <div class="pstats"><span class="bad">Павших <b>${fallen.length}</b></span><span class="ok">Поднимем <b>${pick.length}/${CFG.HOSPITAL_HEAL}</b></span></div>
      ${sortTabs()}
      ${pickBar('снять выбор')}
      <div class="pgrid pick">${list.map(o=>pCard(o.p,pick.includes(o.p)?'sel':'free',o.i)).join('')}</div>
      <div class="mbtns"><button class="ok" id="hOk" ${pick.length?'':'disabled'}>Поднять ${pick.length}</button></div>`;
    bindSort(paint);
    $('card').querySelectorAll('.pcard').forEach(b=>b.onclick=()=>{
      const p=S.pat[+b.dataset.p];
      if(pick.includes(p))pick=pick.filter(x=>x!==p);
      else if(pick.length>=CFG.HOSPITAL_HEAL){toast(`Больше ${CFG.HOSPITAL_HEAL} за раз не поднимут`);return;}
      else pick.push(p);
      paint();
    });
    $('card').querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{
      const m=b.dataset.pick;
      pick = m==='clear' ? [] : fallen.slice().sort((a,b2)=>m==='top'?b2.power-a.power:a.power-b2.power).slice(0,CFG.HOSPITAL_HEAL);
      paint();
    });
    $('hOk').onclick=()=>{
      pick.forEach(p=>p.hurt=0);
      log(`🏥 Госпиталь поднял: ${pick.map(p=>p.name).join(', ')}.`);
      toast(`В строю: ${pick.length}`);
      save(); render(); draw(); closeModal(1);
    };
  };
  paint();
  await done;
}

// ---------- встреча: фишки на одной клетке ----------
// Клетка ничья — её отрабатывает тот, кто приехал первым (у кого больше бросок).
// Клетка чья-то — не до торговли: стрелка, стычка резервов, победитель снимает долю нала
async function meeting(myRoll){
  const t=S.tiles[S.pos], neutral=(t.type==='kiosk'||t.type==='biz')&&!t.owner;
  if(neutral){
    const youFirst=myRoll>=(S.bandRoll||0);
    if(!S.fast)log(`Сошлись на ${name(t)}: ${youFirst?'ты приехал первым':'банда приехала первой'} — клетка её отрабатывает.`);
    if(youFirst)await land(t); else await bandLand();
    return;
  }
  return strelka();
}
async function strelka(){
  const t=S.tiles[S.pos];
  const att=freeBodies(S).sort((a,b)=>b.power-a.power).slice(0,CFG.RAID_MAX);
  const def=freeBodies(S.band).sort((a,b)=>b.power-a.power).slice(0,CFG.RAID_MAX);
  const potMe=Math.round(S.cash*CFG.STRELKA_SHARE), potThem=Math.round(S.band.cash*CFG.STRELKA_SHARE);
  // у обоих пусто — разошлись молча, платить не за что
  if(!att.length&&!def.length){
    if(!S.fast){
      log('Стрелка: драться некому с обеих сторон — разошлись.');
      await modal(`<h2>🤝 Стрелка</h2><p class="t">Сошлись, а бить некем — у обоих отряды в отключке. Постояли и разошлись.</p>`,
        [{t:'Разошлись',v:1,cls:'sec'}]);
    }
    return;
  }
  // драться нечем одной стороне — откуп, без лазарета: наказывать за пустой резерв дважды нельзя
  if(!att.length||!def.length){
    const iAmEmpty=!att.length;
    const sum=iAmEmpty?Math.min(S.cash,potMe):Math.min(S.band.cash,potThem);
    if(iAmEmpty){S.cash-=sum;S.band.cash+=sum;} else {S.band.cash-=sum;S.cash+=sum;}
    if(!S.fast){
      log(`Стрелка без драки: ${iAmEmpty?'резерва нет, откупился на ₽'+sum:'у банды никого, забрал ₽'+sum}.`);
      await modal(`<h2>🤝 Стрелка</h2><p class="t">${iAmEmpty?'Драться нечем — весь отряд в лазарете. Откупился.':'У них никого на подхвате. Взял без боя.'}</p>
        <div class="row"><span class="n">${iAmEmpty?'Отдал':'Взял'}</span><span class="v">₽${sum}</span></div>`,[{t:'Ясно',v:1,cls:'sec'}]);
    }
    render();draw();return;
  }
  if(!S.fast){
    await modal(`<h2>🤝 Стрелка</h2>
      <p class="t">Сошлись нос к носу на ${name(t)}. Разойтись уже нельзя.</p>
      ${vsBlock(powerOf(att),powerOf(def),att.length+' в резерве',def.length+' у банды',false,att,def)}
      <div class="row"><span class="n">Победитель снимает</span><span class="v">₽${potThem} или ₽${potMe}</span></div>`,
      [{t:'🤝 Сходимся',v:1,cls:'red'}]);
  }
  S.pstat.raids++;
  const r=duelChain(att,def,false), мои=r.deadA, их=r.deadB;
  if(r.attWin){
    S.pstat.won++; const sum=Math.min(S.band.cash,potThem);
    S.band.cash-=sum; S.cash+=sum; S.pstat.rent+=sum;
    toLazaret(их); toLazaret(мои); S.pstat.hurt+=мои.length; tireSquad(att.filter(p=>!p.hurt));
    if(!S.fast){fly('💵',AT.tile(S.pos),AT.cash(),flyN(sum),{pulse:'sCash'});
      log(`🤝 Стрелка выиграна: снял ₽${sum}. Полегло ${мои.length}, у них ${их.length}.`);toast(`Разошлись по-твоему · −${мои.length}`);}
  }else{
    const sum=Math.min(S.cash,potMe);
    S.cash-=sum; S.band.cash+=sum; S.pstat.rent-=sum;
    toLazaret(мои); S.pstat.hurt+=мои.length; toLazaret(их);
    if(!S.fast){log(`🤝 Стрелка проиграна: отдал ₽${sum}. Полегло ${мои.length}, у них ${их.length}.`);toast(`Отхватил · −${мои.length}`);}
  }
  render();draw();
}

// Отказаться нельзя. Прочность не восстанавливается между налётами: кто добил — забрал куш.
// Каждый добитый поднимает уровень, дальше крепче и дороже — и не важно, кто его двигал
const kulakMax=lvl=>Math.round((S.kulakBase||150)*CFG.KULAK.hp0*Math.pow(lvl,CFG.KULAK.hpGrow));
const kulakPrize=lvl=>Math.round(avgPrice()*CFG.PRIZE.kulak*Math.pow(lvl,CFG.KULAK.prizeGrow)/10)*10;
function kulakStrike(who,squad){
  const side=who==='you'?S:S.band;
  const att=squad&&squad.length?squad:freeBodies(side).sort((a,b)=>b.power-a.power).slice(0,CFG.RAID_MAX);
  if(!att.length)return{none:true};
  const dmg=Math.max(1,Math.round(powerOf(att)*fightNoise()));
  S.kulak.hp-=dmg;
  if(who==='you')S.pstat.raids++;
  if(S.kulak.hp<=0){
    const win=kulakPrize(S.kulak.lvl), lvl=S.kulak.lvl;
    side.cash+=win;
    if(who==='you'){S.pstat.won++;S.kulakBest=Math.max(S.kulakBest||0,lvl);if(S.diag)S.diag.kulak+=win;}
    S.kulak.lvl++; S.kulak.max=S.kulak.hp=kulakMax(S.kulak.lvl);
    return{kill:true,dmg,win,lvl};
  }
  // не добил — ложится вся выставленная пятёрка: в стычку ходят отрядом, а не по одному
  toLazaret(att.slice());
  if(who==='you')S.pstat.hurt+=att.length;
  return{dmg,hurt:att.length};
}
function kulakBar(){
  const p=Math.max(0,Math.round(S.kulak.hp/S.kulak.max*100));
  return `<div class="kbar"><i style="width:${p}%"></i><b>${S.kulak.hp} / ${S.kulak.max}</b></div>`;
}

// шкала прочности едет от старого значения к новому, с числом урона поверх
function barTo(from,to,max,dmg){
  return new Promise(res=>{
    const fill=$('kfill'), val=$('kval');
    if(!fill){res();return;}
    const box=fill.parentElement; box.classList.add('hit');
    if(dmg){const f=document.createElement('em');f.className='kdmg';f.textContent='−'+dmg;box.appendChild(f);}
    const t0=performance.now(), ms=CFG.SPEED>=100?0:700;
    const step=now=>{
      const p=ms?Math.min(1,(now-t0)/ms):1, e=1-Math.pow(1-p,3);
      const v=Math.round(from+(to-from)*e);
      fill.style.width=Math.max(0,Math.round(v/max*100))+'%';
      if(val)val.textContent=`${Math.max(0,v)} / ${max}`;
      if(p<1)requestAnimationFrame(step);
      else{box.classList.remove('hit');setTimeout(res,ms?250:0);}
    };
    requestAnimationFrame(step);
  });
}

async function collectDrop(t){
  const d=t.drop;t.drop=null;let m;
  if(d.cash>0){S.cash+=d.cash;fly('💵',AT.tile(t.i),AT.cash(),flyN(d.cash),{pulse:'sCash'});float(t.i,'+$'+d.cash,'#8bc34a');m=`💵 Подобрал ₽${d.cash} на стройке.`;}
  else if(d.rolls){S.rolls+=d.rolls;fly('🎲',AT.tile(t.i),AT.dice(),2);float(t.i,'+'+d.rolls+' хода','#8bc34a');m=`🎲 Нашёл на стройке +${d.rolls} хода.`;}
  else if(d.hard){S.hard+=d.hard;fly('$',AT.tile(t.i),AT.hard(),1,{pulse:'sHard'});float(t.i,'+$'+d.hard,'#8fb3ff');m=`$ Нашёл на стройке кристалл!`;}
  else if(d.cash<0){const x=pay(-d.cash);float(t.i,'−$'+x,'#ef5350');m=`⚠️ Разбитое стекло под ногами: −₽${x}.`;}
  else if(d.goods){const ks=myKiosks().filter(k=>k.goods>0);if(ks.length){const k=ks[Math.floor(Math.random()*ks.length)],n=Math.min(d.goods,k.goods);k.goods-=n;float(t.i,'−'+n+' шт','#ef5350');m=`⚠️ Гопники отжали ${n} шт из ${name(k)}.`;}else{float(t.i,'фух','#9aa3b8');m='⚠️ Гопники хотели отжать товар, а отжимать нечего.';}}
  else{S.rolls=Math.max(0,S.rolls-1);float(t.i,'−1 ход','#ef5350');m='⚠️ Провалился в лужу по колено: −1 ход.';}
  log(m);render();await wait(350);
}
async function land(t){
  S.landN=(S.landN||0)+1;
  track('land',{tile:t.i,ttype:t.type,owner:!!t.owner,locked:!unlocked(t)});
  if(t.drop)await collectDrop(t);
  if(!unlocked(t))return street(t);
  if(t.type==='police')return police();
  if(t.type==='pot')return potTile();
  if(t.type==='scatter')return scatter();
  if(t.type==='chance')return kulak();
  if(t.type==='hospital')return hospital();
  if(t.type==='luck')return luckTile();
  if(t.type==='mini')return miniGame(t.i);
  if(t.type==='wh')return shop();
  if((t.type==='kiosk'||t.type==='biz')&&isTheirs(t))return rentOrRaid(t);
  // точки и бизнесы не открываются сами — строка над доком подсвечивается, окно по тапу
  render(); const tb=$('tilebar'); if(tb&&!tb.hidden){tb.classList.add('pulse');setTimeout(()=>tb.classList.remove('pulse'),2400);}
  if(!t.owner&&S.cash>=t.price)hint('tapRow','Остановился на чужой точке — строка внизу открывает карточку и покупку.');
}

// ---------- склад: закупка по товару, раскладка по ларькам сама (сначала ларьки с большими продажами) ----------
// План закупки: сначала то, что успеет продаться на ближайшем круге, и по убыванию
// отдачи на рубль (маржа с учётом монополии / цена закупки). Остаток бюджета — в запас.
function buyPlan(budget){
  const lots=[];
  for(const t of myKiosks()){
    const room=cap(t)-t.goods; if(room<=0)continue;
    const g=t.good, buy=buyPrice(g); if(buy<=0)continue;
    const margin=Math.round(sellPrice(g)*monoMult('you',g))-buy;
    const forNext=Math.max(0,Math.min(room,sales(t)-t.goods));   // продастся уже на этом круге
    if(forNext>0)lots.push({t,n:forNext,buy,margin,roi:margin/buy,pri:0});
    const rest=room-forNext;
    if(rest>0)lots.push({t,n:rest,buy,margin,roi:margin/buy,pri:1}); // запас на потом
  }
  lots.sort((a,b)=>a.pri-b.pri||b.roi-a.roi||b.margin-a.margin);
  let left=budget, spent=0, gain=0, units=0;
  const plan=[];
  for(const l of lots){
    const n=Math.min(l.n,Math.floor(left/l.buy));
    if(n<=0)continue;
    plan.push({t:l.t,n}); left-=n*l.buy; spent+=n*l.buy; units+=n;
    if(l.pri===0)gain+=n*l.margin;
  }
  return{plan,spent,gain,units};
}
function goodKiosks(g){return myKiosks().filter(t=>t.good===g).sort((a,b)=>sales(b)-sales(a));}
function goodCap(g){return goodKiosks(g).reduce((s,t)=>s+cap(t),0);}
function goodSales(g){return goodKiosks(g).reduce((s,t)=>s+sales(t),0);}
let lastFly={};
function addGoods(g,n){ // по кругу, начиная с самых продающих; возвращает сколько реально разложено
  const ks=goodKiosks(g);let put=0;const got=new Set();
  while(n>0){let any=false;for(const t of ks){if(n<=0)break;if(t.goods<cap(t)){t.goods++;n--;put++;any=true;got.add(t.i);}}if(!any)break;}
  const now=performance.now(); if(put&&now-(lastFly[g]||0)>160){lastFly[g]=now;fly('💵',AT.cash(),AT.card(),1);got.forEach(i=>fly(good(g).icon,AT.card(),AT.tile(i),1,{delay:120}));}
  return put;
}

  ev.push(()=>{const m=5*sc+Math.floor(Math.random()*10*sc);S.cash+=m;return `🪙 Нашёл на тротуаре ₽${m}. Америка сорит деньгами.`;});
  ev.push(()=>{const m=pay(3*sc+Math.floor(Math.random()*6*sc));return `🥾 Наступил в жвачку, порвал кроссовок: −₽${m}.`;});
  ev.push(()=>{S.rolls+=1;return `🚌 Подвёз знакомый на пикапе: +1 ход.`;});
  const room=ks.filter(k=>k.goods<cap(k));
  if(room.length)ev.push(()=>{const k=room[Math.floor(Math.random()*room.length)],n=Math.min(2,cap(k)-k.goods);k.goods+=n;float(k.i,'+'+n+' шт','#8bc34a',1.2);return `🎁 Прораб отдал коробку: +${n} шт ${good(k.good).name.toLowerCase()} в твою точку.`;});
  if(bz.length)ev.push(()=>{const m=bz.reduce((s,b)=>s+fee(b),0)*2;S.cash+=m;S.stat.earned+=m;return `🚧 Строители пошли обедать в твои бизнесы: +₽${m} (двойной сбор с каждого).`;});
  else ev.push(()=>`🏢 Строители ищут, где пообедать. Был бы у тебя бизнес — оставили бы деньги.`);
  if(S.day>=CFG.TREND_FROM_DAY){const open=availableGoods();ev.push(()=>{const g=open[Math.floor(Math.random()*open.length)];S.trend=g.id;return `📺 По MTV показали ${g.name.toLowerCase()} — все хотят! Сегодня ${g.icon} продаётся ×${CFG.TREND_MULT}.`;});}
  const have=ks.filter(k=>k.goods>0);
  if(have.length)ev.push(()=>{ // оптовики: 25% / 50% / 100% всего запаса или 100% одной категории
    const roll=Math.random(), kinds=[{w:.4,share:.25,mult:1.3,who:'Мелкий оптовик'},{w:.3,share:.5,mult:1.4,who:'Оптовик из Нью-Джерси'},{w:.1,share:1,mult:1.5,who:'Крупный оптовик'},{w:.2,share:1,mult:1.6,who:'Коллекционер',one:true}];
    let acc=0,k=kinds[0];for(const x of kinds){acc+=x.w;if(roll<=acc){k=x;break;}}
    let total=0,units=0;
    const goods=k.one?[have[Math.floor(Math.random()*have.length)].good]:[...new Set(have.map(t=>t.good))];
    for(const g of goods){const n=Math.max(1,Math.round(stock(g)*k.share));if(n<=0)continue;const m=Math.round(n*sellPrice(g)*k.mult);takeGoods(g,n);units+=n;total+=m;}
    S.cash+=total;S.stat.earned+=total;S.dstat.earned+=total;S.stat.sold+=units;S.dstat.sold+=units;qProg('sell',units);qProg('earn',total);
    const what=k.one?`весь твой товар «${good(goods[0]).name}»`:k.share>=1?'весь товар с твоих точек':`${Math.round(k.share*100)}% товара с твоих точек`;
    return `🤵 ${k.who} скупил ${what}: ${units} шт за ₽${total}, на ${Math.round((k.mult-1)*100)}% дороже обычного.`;});
  if(ks.length)ev.push(()=>{const k=ks[Math.floor(Math.random()*ks.length)];if(k.capLvl<capTab(k).length){const was=cap(k);k.capLvl++;float(k.i,'📦 '+was+'→'+cap(k),'#8bc34a',1.2);return `🇺🇸 Грант малому бизнесу: твоей точке «${good(k.good).name}» бесплатно подняли вместимость ${was} → ${cap(k)} шт.`;}S.cash+=50*sc;return `🇺🇸 Грант малому бизнесу: +₽${50*sc} наличными.`;});
  const c0=S.cash, r0=S.rolls;

  render(); await wait(500);

// ---------- полиция: заплати или сиди, 3 попытки на дубль ----------
// как в коре: цена выхода = максимальный доход за круг × PenaltyPercent; нет столько — забирают всё, что есть `[код]`
function policeFine(){
  const price=Math.round(Math.max(lapPotential(),S.roundMax||0)*CFG.JAIL.penaltyPercent);
  return price<=0?CFG.JAIL.minReleasePrice:Math.min(price,Math.max(S.cash,CFG.JAIL.minReleasePrice));
}
function policeFineOld(){return Math.max(CFG.POLICE.dayFine[Math.min(S.day,CFG.POLICE.dayFine.length)-1],Math.round(lapNet()*CFG.POLICE.lapShare/10)*10);} // растёт по дням: пол дня или половина чистой прибыли за круг
async function police(){
  const pts=S.tiles.filter(t=>(t.type==='kiosk'||t.type==='biz')&&isMine(t)&&unlocked(t));
  const fine=policeFine();
  const v=await modal(`<h2>🚔 Тюрьма</h2><p class="t">«Торгуем без патента, гражданин?» Заплати сейчас — или сиди: ${CFG.POLICE.attempts} броска на дубль, дубль выпускает бесплатно. Не выпал — отпустят, но штраф всё равно снимут, а ходы сгорят.</p>
    <div class="row"><span class="n">Штраф<small>половина чистой прибыли за круг, не меньше ₽${CFG.POLICE.dayFine[Math.min(S.day,CFG.POLICE.dayFine.length)-1]} в день ${S.day} · уходит в копилку 🎰</small></span><span class="v">₽${fine}</span></div>`,
    [{t:'Заплатить · $'+fine,v:1,cls:'ok',dis:S.cash<fine},{t:`Откупиться · $${CFG.HARD.bail}`,v:3,cls:'hard',dis:S.hard<CFG.HARD.bail},{t:'Сидеть, ловить дубль',v:0,cls:'bad'}],{sticky:true});
  track('police',{choice:v===3?'bail':v===1?'pay':'sit',fine});
  if(v===3){spendHard(CFG.HARD.bail,AT.tile(15));log(`Откупился от полиции за $${CFG.HARD.bail}.`);}
  else if(v===1){pay(fine);log(`Заплатил полиции ₽${fine}.`);}else{S.jail=CFG.POLICE.attempts;S.jailFine=fine;log(`Сел в участок: ${CFG.POLICE.attempts} попытки на дубль, иначе штраф ₽${fine}.`);hint('jail','В участке кнопка «Бросить» ловит дубль. Три промаха — отпустят со штрафом.');}
  save();render();

// ---------- инкассатор: раскидывает деньги и неприятности по стройке ----------
async function scatter(){
  let spots=S.tiles.filter(t=>!unlocked(t)&&!t.drop&&t.i!==S.pos);
  if(spots.length<4)spots=S.tiles.filter(t=>t.i!==0&&t.i!==S.pos&&!t.drop&&(t.type==='kiosk'||t.type==='biz')&&!t.owner);
  spots.sort(()=>Math.random()-0.5);
  const c=CFG.SCATTER,sc=S.day;let money=0,n=0;
  const plan=[];
  let rollsN=0,hardN=0;
  spots.slice(0,c.drops).forEach(t=>{const r=Math.random();if(r<c.hardChance){plan.push({t,drop:{hard:1},icon:'$'});hardN++;}else if(r<c.hardChance+c.rollsChance){plan.push({t,drop:{rolls:2},icon:'🎲'});rollsN++;}else{const m=(c.min+Math.floor(Math.random()*(c.max-c.min)))*sc;plan.push({t,drop:{cash:m},icon:'🪙'});money+=m;}n++;});
  toast(`🚚 Мешок лопнул! ₽${money} разлетелось по стройке`);
  await flyDrops(plan);
  log(`🚚 Инкассатор растерял мешок: ₽${money}${rollsN?', '+rollsN+'×🎲':''}${hardN?', '+hardN+'×$':''} разлетелось по ${n} клеткам стройки. Забираешь, когда останавливаешься.`);render();
}
async function flyDrops(plan){
  // купюры вылетают из клетки инкассатора дугой и ложатся на клетки; drop появляется по приземлению
  const[g1,g2]=gridOf(S.pos),[x0,y0]=iso(g1,g2),now=performance.now();
  plan.forEach((pl,idx)=>{const[a,b]=gridOf(pl.t.i),[x1,y1]=iso(a,b);
    flyers.push({x0,y0:y0-TH,x1,y1:y1-TH*0.3,icon:pl.icon,t0:now+idx*90/CFG.SPEED,ms:750/CFG.SPEED,p:0,onDone:()=>{pl.t.drop=pl.drop;if(!(pl.drop.cash>0))float(pl.t.i,pl.drop.rolls?'🎲':pl.drop.hard?'$':'⚠️','#ef5350');kick();}});});
  kick();
  await wait(750+plan.length*90+200);
  for(const f of flyers){if(!f.done){f.done=true;f.onDone&&f.onDone();}} flyers=[]; // страховка, если кадры не тикали
}
// ---------- хулиганы: раскидывают неприятности по стройке ----------
async function hazard(){
  let spots=S.tiles.filter(t=>!unlocked(t)&&!t.drop&&t.i!==S.pos);
  if(spots.length<3)spots=S.tiles.filter(t=>t.i!==0&&t.i!==S.pos&&!t.drop&&(t.type==='kiosk'||t.type==='biz')&&!t.owner);
  spots.sort(()=>Math.random()-0.5);
  const sc=S.day,plan=[];
  spots.slice(0,CFG.HAZARD.troubles).forEach((t,i)=>{const r=i%3;plan.push({t,drop:r===0?{cash:-(5+Math.floor(Math.random()*10))*sc}:r===1?{hour:1}:{goods:2},icon:'⚠️'});});
  toast('🌪 Хулиганы разбежались по стройке');
  await flyDrops(plan);
  log(`🌪 Местные хулиганы набедокурили на стройке: ${plan.length} неприятности. Остановишься — влетишь.`);render();
}

// ---------- такси (как в коре): доехать без бросков ----------
async function taxi(){
  if(moving||S.finished)return;
  if(S.jail>0){toast('Из участка такси не ездит.');return;}
  const tp=taxiPrice();
  const dests=[];
  for(let k=1;k<40;k++){const t=S.tiles[(S.pos+k)%40];if(t.type==='wh'&&unlocked(t)){dests.push({i:t.i,n:'🏬 Ближайший Склад'});break;}}
  dests.push({i:0,n:'🏁 Старт'});
  if(S.day>=CFG.BANK_DAY&&unlocked(S.tiles[20]))dests.push({i:20,n:'🏦 Банк'});
  const opts=dests.filter(d=>d.i!==S.pos);
  const v=await modal(`<h2>🚕 Yellow Cab <small>$${tp} за поездку${S.taxiRides?', следующая вдвое дороже':''}</small></h2><p>Довезёт сразу, без бросков. Сборы по дороге не собираются.</p>`,
    opts.map(d=>({t:`${d.n}<small>$${tp}</small>`,v:d.i,cls:'ok',dis:S.hard<tp})).concat([{t:'Отмена',v:-1,cls:'sec'}]));
  if(v===undefined||v<0)return;
  if(!spendHard(tp,AT.el('bTaxi')))return; track('taxi',{to:v,cost:tp}); S.taxiRides=(S.taxiRides||0)+1; moving=true; pan={x:0,y:0}; render();
  await step(S.pos,v,CFG.MOVE_MS*3,'one'); S.pos=v; float(v,'🚕','#ffd54f'); render();
  await land(S.tiles[v]);
  moving=false; save(); render();
}

// ---------- кнопка поставки: открывает окно в любой момент, одна поставка в день ----------

// ---------- поставка: из запасов точек, при остановке на старте или в конце дня ----------
async function parcel(forced,catchUp){
  if(S.finished)return;
  if(catchUp&&!canCatchup())return;
  if(S.parcelSent&&!catchUp){toast('Поставка сегодня уже ушла. Следующая — завтра.');return;}
  const k=catchUp?catchUnits():slotUnits(),R=catchUp?catchReward():dayReward(),best=CFG.GOODS.slice().sort((x,y)=>y.pts-x.pts).find(g=>possibleGoods().includes(g));

  let box={}; CFG.GOODS.forEach(g=>box[g.id]=0);
  const used=()=>Object.values(box).reduce((a,b)=>a+b,0), pts=()=>parcelPts(box,R);

  if(forced)autofill();

    const N=slots(),n=used(),p=pts(),share=Math.round(p/R*100);

    for(let i=n;i<N;i++)sl+=`<div class="slot"><small>×${k}</small></div>`;
    const canSlot=S.extraSlots<CFG.EXTRA_SLOT.perDay, hp=CFG.HARD.slot*Math.pow(2,S.extraSlots||0);
    const gs=ALL_GOODS().filter(g=>stock(g.id)>0||box[g.id]>0);
    $('card').innerHTML=`<h2>📦 ${catchUp?'Догоняющая поставка':'Поставка в Союз'} <small>${catchUp?'за пропущенный день · '+R+' очков максимум':forced?'фура уходит':'1 в день'} · ${N} мест по ${k} шт</small>${helpBtn(`Одна поставка в день. Место в фуре вмещает ${k} шт одного товара, с каждым днём больше. Очки — доля от лучшей возможной поставки дня (${CFG.PARCEL_SLOTS} мест лучшего товара = ${R} очков); лишние места дают сверх того. Не отправишь сам — в полночь фура заберёт самое дорогое. Остатки за неделю сгорают.`)}</h2>
      ${hintHtml('parcel','Поставка — кнопка 📦 в доке, одна в день, из товара твоих точек. Что отправишь, то уже не продашь. Дорогой товар даёт больше очков за место. Очки — это билет Джонни.')}
      ${forced?'<p class="t">День кончился. Фура забирает то, что положишь сейчас.</p>':catchUp?`<p class="t">Вторая фура за день — за поставку, которую ты пропустил: место вмещает ${k} шт, как в тот день, и очки по награде того дня. Отстаёшь ещё на ${parcelsBehind()-1}.</p>`:''}
      <div class="slots">${sl}</div>
      <div class="row" style="border:0;padding:4px 0"><span class="n">Лучший товар дня: ${best?best.icon+' '+best.name:'—'}<small>полная фура из него — ${R} очков</small></span><span class="v">${p} <small>из ${R}</small></span></div>
      <div class="bar"><i style="width:${Math.min(100,share)}%"></i></div>`+
      gs.map(g=>{const can=Math.floor(stock(g.id)/k);return `<div class="row"><span class="n">${g.icon} ${g.name} <small>${g.pts} очк./шт · в точках ${stock(g.id)} · хватит на ${can} ${can===1?'место':'мест'}</small></span>

      `${canSlot?(()=>{const rest=CFG.GOODS.filter(g=>Math.floor(stock(g.id)/k)-box[g.id]>0).sort((a,b)=>b.pts-a.pts)[0],gain=rest?Math.round(k*rest.pts/(CFG.PARCEL_SLOTS*bestPtsToday())*R):0,full=n>=N&&!!rest;return `<div class="row ${full?'hot':''}"><span class="n">Ещё одно место в контейнере${gain?` <b>+${gain} очк.</b>`:''}<small>${full?'фура полна, а '+rest.icon+' '+rest.name+' остаётся · ':''}только на сегодня · каждое следующее вдвое дороже · осталось ${CFG.EXTRA_SLOT.perDay-S.extraSlots}</small></span><span class="qty"><button class="sm hard ${full?'blink':''}" id="mSlotH" ${S.hard<hp?'disabled':''}>$${hp}</button></span></div>`;})():''}

// Капитал = нал + сколько вложено в свои объекты + товар на точках по цене сбыта.
// Старая формула считала оценку по коэффициентам ивента и игнорировала товар —
// из-за этого игрок с полными складами видел, что «отстаёт»
function goodsValue(side){
  return S.tiles.filter(t=>t.type==='kiosk'&&t.owner===side&&unlocked(t)&&t.goods>0)
    .reduce((a,t)=>a+t.goods*sellPrice(t.good),0);
}
function capitalParts(who){
  const tiles=who==='you'?myTiles():bandTiles();
  const cash=who==='you'?S.cash:S.band.cash;
  const assets=tiles.reduce((a,t)=>a+invested(t),0);
  const goods=goodsValue(who);
  return {cash:Math.round(cash), assets:Math.round(assets), goods:Math.round(goods),
          total:Math.round(cash+assets+goods)};
}
function capitalOf(who){ return capitalParts(who).total; }
function autoGuards(){
  const keep=Math.max(3,Math.ceil(S.pat.filter(p=>!p.hurt).length*0.3));
  myTiles().sort((a,b)=>b.price-a.price).forEach(t=>{
    while(!(t.guards||[]).length && freeBodies(S).length>keep) addGuard(t,S,1);
  });
  log('Расставил охрану автоматом.');save();render();draw();
}

// ---------- бот и массовый прогон: баланс без анимации ----------
const BOT={get reserve(){return Math.round(avgPrice()*0.25);},        // запас на закупку товара
           get keepForTile(){return Math.round(avgPrice()*1.1);}};   // и на следующую точку — она важнее прокачки
function botStock(){            // закупка товара: сначала самый маржинальный с учётом монополии
  const SIDE='you'; let g=0;
  while(g++<400){
    const ks=myKiosks().filter(t=>t.goods<cap(t)).sort((a,b)=>(sellPrice(b.good)*monoMult(SIDE,b.good)-buyPrice(b.good))-(sellPrice(a.good)*monoMult(SIDE,a.good)-buyPrice(a.good)));
    if(!ks.length)break;
    const t=ks[0], p=buyPrice(t.good);
    if(S.cash-p<BOT.reserve*0.2)break;
    S.cash-=p; t.goods++;
  }
}
function botBuy(t){
  if(t.owner||!(t.type==='kiosk'||t.type==='biz')||!unlocked(t))return false;
  if(S.cash<t.price+BOT.reserve*0.5)return false;
  S.cash-=t.price; t.owner='you'; t.capLvl=1; t.salesLvl=1; t.goods=0; t.invested=t.price; if(t.type==='biz')t.level=1;
  unstash('you'); S.stat.bought++; if(S.diag)S.diag.buyMe++; return true;
}
function botUpgrade(){
  let g=0;
  while(g++<40){
    const opts=[];
    for(const t of myTiles()){
      const mx=t.cfg?t.cfg.upg:11;
      if(t.type==='kiosk'){
        if(t.capLvl<mx)opts.push({t,k:'cap',c:capCost(t)});
        if(t.salesLvl<mx)opts.push({t,k:'sal',c:salesCost(t)});
      } else if(t.level<mx)opts.push({t,k:'biz',c:bizUpCost(t)});
    }
    const free=S.tiles.some(t=>!t.owner&&(t.type==='kiosk'||t.type==='biz'));
    const keep=BOT.reserve+(free?BOT.keepForTile:0);
    const best=opts.filter(o=>S.cash-o.c>=keep).sort((a,b)=>a.c-b.c)[0];
    if(!best)break;
    S.cash-=best.c; best.t.invested=invested(best.t)+best.c;
    if(best.k==='cap')best.t.capLvl++; else if(best.k==='sal')best.t.salesLvl++; else best.t.level++;
  }
}
// охрана: сначала по одному на каждую точку, потом добиваем слоты от дорогой к дешёвой,
// но пятёрку всегда держим в резерве — без неё нечем наезжать и нечем бить Кулака
function botGuards(who){
  const side=who==='you'?S:S.band, tiles=(who==='you'?myTiles():bandTiles()).sort((a,b)=>b.price-a.price);
  const keep=CFG.RAID_MAX;
  for(const t of tiles){ if(!(t.guards||[]).length&&freeBodies(side).length>keep) addGuard(t,side,1); }
  for(const t of tiles){ while((t.guards||[]).length<guardMax(t)&&freeBodies(side).length>keep) addGuard(t,side,1); }
}
function botTurn(){
  const t=S.tiles[S.pos];
  botBuy(t);
  if(t.type==='wh')botStock();
  botUpgrade();
  botGuards('you');
}

// ---------- накопленные метрики ----------
async function metricsWindow(){
  const h=histAll(), live=h.filter(x=>x.kind==='live'), bots=h.filter(x=>x.kind==='bot');
  const done=live.filter(x=>x.finished);
  const avg=(a,f)=>a.length?Math.round(a.reduce((s,x)=>s+f(x),0)/a.length):0;
  const cfgs=[...new Set(h.map(x=>x.cfg))];
  const rows=h.slice(-12).reverse().map(x=>x.kind==='bot'
    ? `<div class="row"><span class="n">🤖 ${x.games} партий · ${x.laps} кругов · старт ₽${x.startCash}<small>конфиг ${x.cfg} · ${new Date(x.updatedAt).toLocaleString('ru')}</small></span>
        <span class="v">${x.stars.map((n,i)=>i?'⭐'.repeat(i)+n:'—'+n).join(' · ')}</span></div>`
    : `<div class="row"><span class="n">🎮 ${x.player||'без имени'} · круг ${x.lap}/${x.laps}${x.finished?' · финал':''}<small>конфиг ${x.cfg} · ${new Date(x.updatedAt).toLocaleString('ru')}</small></span>
        <span class="v">${x.stars?'⭐'.repeat(x.stars):'—'} · ${x.tilesYou}:${x.tilesBand}</span></div>`).join('');
  const v=await modal(`<h2>📊 Накоплено</h2>
    <div class="pstats"><span>Записей <b>${h.length}</b></span><span>Живых партий <b>${live.length}</b></span>
      <span>Доиграно <b>${done.length}</b></span><span>Прогонов ботом <b>${bots.length}</b></span>
      <span>Конфигов <b>${cfgs.length}</b></span></div>
    ${done.length?`<div class="row"><span class="n">Живые партии: капитал</span><span class="v">${avg(done,x=>x.capYou)} против ${avg(done,x=>x.capBand)}</span></div>
      <div class="row"><span class="n">Живые партии: точки</span><span class="v">${avg(done,x=>x.tilesYou)} : ${avg(done,x=>x.tilesBand)}</span></div>`:''}
    <h3 style="margin:10px 0 2px;font-size:13px">Последние записи</h3>
    ${rows||'<p class="t">Пока пусто — сыграй партию или запусти прогон.</p>'}`,
    [{t:'📤 Скопировать всё',v:1,cls:'ok'},{t:'🗑 Очистить',v:2,cls:'bad'},{t:'Закрыть',v:0,cls:'sec'}]);
  if(v===1)exportRun();
  if(v===2){ localStorage.removeItem(HISTK); toast('История метрик очищена'); }
}

// ---------- рендер ----------
const cv=$('board'),cx=cv.getContext('2d');
let TW=60,TH=30,OX=0,OY=0;
function gridOf(i){if(i<10)return[10-i,10];if(i<20)return[0,20-i];if(i<30)return[i-20,0];return[10,i-30];}
function iso(gx,gy){return[OX+(gx-gy)*TW/2,OY+(gx+gy)*TH/2];}
function panelH(){const p=$('panel');const h=(p&&p.offsetHeight)||0;return h>20?h-40:0;} // док лежит поверх поля; часть его высоты — прозрачный градиент
function fit(){
  try{const ui=Math.max(0.78,Math.min(1,window.innerWidth/430,window.innerHeight/840));document.documentElement.style.setProperty('--ui',ui.toFixed(3));
    if(!('zoom' in document.documentElement.style)){document.documentElement.classList.add('nozoom');[['top','top center'],['panel','bottom center'],['inv','bottom left'],['tip','bottom center'],['toast','top center']].forEach(([id,o])=>{const el=$(id);if(el){el.style.transform=`scale(${ui})`;el.style.transformOrigin=o;}});}
    const ph=$('panel').getBoundingClientRect().height,th=$('top').getBoundingClientRect().height;
    document.documentElement.style.setProperty('--panelH',Math.max(80,(ph||220)-70*ui)+'px');document.documentElement.style.setProperty('--topH',(th||170)+'px');}catch(e){}
  const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  cv.width=r.width*dpr;cv.height=r.height*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  TW=Math.max(56,Math.min(130,r.width/CFG.ZOOM));TH=TW*0.58;OX=0;OY=0;
}
function float(i,text,color,size){const[gx,gy]=gridOf(i),[x,y]=iso(gx,gy);floats.push({x,y:y-10,text,color,t:0,size:size||1});kick();}
const LOCK_COL='#2b3f33', FREE_COL='#cfd8c8';
// сумма дропа → стопка монет 1..4 (относительно разброса инкассатора за день)
function coinTier(cash){const c=CFG.SCATTER,lo=c.min*S.day,hi=c.max*S.day;const q=hi>lo?(cash-lo)/(hi-lo):1;return Math.max(1,Math.min(4,1+Math.floor(q*4)));}
function drawCoins(px,py,tier){const rx=TW*(0.085+0.012*tier),ry=rx*0.5,step=rx*0.42,n=tier;
  for(let k=0;k<n;k++){const yy=py-k*step;cx.beginPath();cx.ellipse(px,yy,rx,ry,0,0,Math.PI*2);cx.fillStyle=k===n-1?'#ffd54f':'#e2a72e';cx.fill();cx.lineWidth=Math.max(1,TW*0.012);cx.strokeStyle='#7a5a12';cx.stroke();}
  // ребро верхней монеты и блик
  const top=py-(n-1)*step;cx.beginPath();cx.ellipse(px,top,rx*0.62,ry*0.62,0,0,Math.PI*2);cx.strokeStyle='#b8860b';cx.lineWidth=Math.max(1,TW*0.01);cx.stroke();
  cx.beginPath();cx.ellipse(px-rx*0.3,top-ry*0.25,rx*0.18,ry*0.16,0,0,Math.PI*2);cx.fillStyle='#fff3c4';cx.fill();}
// цвет = владелец. Свои зелёные, банда красная, ничьё и служебное — песочное
const MINE_COL='#3f8f4c', BAND_COL='#c9432f';
// бизнесы — та же принадлежность, но тон темнее и коричневее, чтобы не путались с точками
const MINE_BIZ='#2a6135', BAND_BIZ='#8d3320', FREE_BIZ='#a8906a';
function tileColor(t){
  const biz=t.type==='biz';
  if(isMine(t))return biz?MINE_BIZ:MINE_COL;
  if(isTheirs(t))return biz?BAND_BIZ:BAND_COL;
  if(!unlocked(t))return LOCK_COL;
  return biz?FREE_BIZ:FREE_COL;
}
function mix(a,b,p){const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);const c=sh=>Math.round(((A>>sh)&255)+(((B>>sh)&255)-((A>>sh)&255))*p);return'#'+[16,8,0].map(sh=>c(sh).toString(16).padStart(2,'0')).join('');}
function revealP(t){if(!reveal||t.zone!==reveal.zone)return 1;const z=CFG.ZONES[reveal.zone];return Math.max(0,Math.min(1,(Date.now()-reveal.t0-(t.i-z.from)*150)/600));}
function tileH(t){return 0;} // поле плоское; уровень показывают звёзды
function shade(hex,amt){const n=parseInt(hex.slice(1),16);const c=v=>Math.max(0,Math.min(255,v+amt));return`rgb(${c(n>>16)},${c((n>>8)&255)},${c(n&255)})`;}
let camMoving=false, camLast=0;
function draw(){
  const r=cv.getBoundingClientRect();cx.clearRect(0,0,r.width,r.height);
  // герой: позиция (интерполяция между клетками + прыжок)
  let hx,hy,hop=0,hi=S.pos;
  if(anim&&anim.done&&S.pos===anim.to)anim=null; // S.pos догнал анимацию — можно отпустить
  if(anim){const[a1,a2]=gridOf(anim.from),[b1,b2]=gridOf(anim.to),p=anim.p||0;
    const A=iso(a1,a2),B=iso(b1,b2);hx=A[0]+(B[0]-A[0])*p;hy=A[1]+(B[1]-A[1])*p;hop=Math.sin(Math.PI*p)*TH*0.7;hi=p<0.5?anim.from:anim.to;}
  else{const[g1,g2]=gridOf(S.pos);[hx,hy]=iso(g1,g2);}
  // камера плавно догоняет фишку
  if(camHold&&Date.now()<camHold.until)camT={x:camHold.x,y:camHold.y};
  else{camHold=null;
    // камера смотрит между фишками; позицию банды берём по её анимации, а не по клетке —
    // иначе цель прыгает и камера дёргается
    let tx=hx, ty=hy-TH*0.9;
    if(S.band){
      let bx0,by0;
      if(bAnim){const bp=Math.min(1,(performance.now()-bAnim.t0)/bAnim.ms);
        const A=iso(...gridOf(bAnim.from)),B2=iso(...gridOf(bAnim.to));
        bx0=A[0]+(B2[0]-A[0])*bp; by0=A[1]+(B2[1]-A[1])*bp;}
      else [bx0,by0]=iso(...gridOf(S.band.pos));
      const w=CFG.CAM_BAND_WEIGHT;
      tx=hx*(1-w)+bx0*w; ty=(hy-TH*0.9)*(1-w)+(by0-TH*0.9)*w;}
    camT={x:tx,y:ty};}
  // сглаживание не зависит от частоты кадров: на 120 Гц камера не догоняет вдвое быстрее
  {const now2=performance.now(); const dt=Math.min(0.05,((now2-(camLast||now2))||16)/1000); camLast=now2;
   const a=1-Math.exp(-CFG.CAM_SMOOTH*dt);
   cam.x+=(camT.x-cam.x)*a; cam.y+=(camT.y-cam.y)*a;}
  camMoving=Math.hypot(camT.x-cam.x,camT.y-cam.y)>0.5;
  const offX=r.width/2-cam.x+pan.x, offY=(r.height-panelH())/2-cam.y+pan.y;
  cx.save();cx.translate(offX,offY);
  const order=S.tiles.slice().sort((a,b)=>{const[ax,ay]=gridOf(a.i),[bx,by]=gridOf(b.i);return(ax+ay)-(bx+by);});
  cx.beginPath();const c=[iso(1,1),iso(9,1),iso(9,9),iso(1,9)];cx.moveTo(c[0][0],c[0][1]);c.forEach(p=>cx.lineTo(p[0],p[1]));cx.closePath();cx.fillStyle='#123020';cx.fill();
  const[cxx,cyy]=iso(5,5);
  cx.fillStyle='#1e5236';cx.font=`${Math.round(TW*0.22)}px sans-serif`;cx.textAlign='center';cx.textBaseline='middle';cx.fillText('ПЕРЕДЕЛ · РАЙОН',cxx,cyy);
  const drawHero=()=>{const t=S.tiles[hi],h=tileH(t);
    const hyy=hy-TH*0.5-h*0.2-hop;cx.save();cx.shadowColor='#0009';cx.shadowBlur=4;cx.shadowOffsetY=2;cx.fillStyle='rgba(43,39,35,0.85)';cx.beginPath();cx.arc(hx,hyy,TW*0.23,0,Math.PI*2);cx.fill();cx.restore();
    cx.strokeStyle='#f1e9d2';cx.lineWidth=2;cx.beginPath();cx.arc(hx,hyy,TW*0.23,0,Math.PI*2);cx.stroke();
    cx.font=`${Math.round(TW*0.36)}px sans-serif`;cx.textAlign='center';cx.textBaseline='middle';cx.fillText('🧢',hx,hyy+1);};
  // подписи поля в стиле HUD: кремовая пилюля, чернильный текст
  const pill=(px,py,text,fg,sz,bg,stroke)=>{cx.font=`bold ${Math.round(sz)}px sans-serif`;cx.textAlign='center';cx.textBaseline='middle';const w=cx.measureText(text).width+sz*0.9,hh=sz*1.35;
    cx.fillStyle=bg||'#f1e9d2';cx.beginPath();cx.roundRect(px-w/2,py-hh/2,w,hh,hh/2);cx.fill();if(stroke){cx.lineWidth=2;cx.strokeStyle=stroke;cx.strokeText(text,px,py+0.5);}cx.fillStyle=fg;cx.fillText(text,px,py+0.5);return w;};
  const pillW=(text,sz)=>{cx.font=`bold ${Math.round(sz)}px sans-serif`;return cx.measureText(text).width+sz*0.9;};
  const labelRow=(px,py,items)=>{const gap=TW*0.04;let tot=items.reduce((a,it)=>a+pillW(it.t,it.sz),0)+gap*(items.length-1),cxp=px-tot/2;for(const it of items){const w=pillW(it.t,it.sz);pill(cxp+w/2,py,it.t,it.fg,it.sz,it.bg,it.stroke);cxp+=w+gap;}};
  const outlined=(px,py,text,fg,sz)=>{cx.font=`bold ${Math.round(sz)}px sans-serif`;cx.textAlign='center';cx.textBaseline='middle';cx.lineWidth=Math.max(2,sz*0.18);cx.strokeStyle='#2b2723';cx.strokeText(text,px,py);cx.fillStyle=fg;cx.fillText(text,px,py);};
  const now=Date.now();let anyEmpty=false;
  let anyReveal=false;
  for(const t of order){
    const[gx,gy]=gridOf(t.i),[x0,y0]=iso(gx,gy),lock=!unlocked(t),h=tileH(t),rp=revealP(t),col=rp<1?mix(LOCK_COL,tileColor(t),rp):tileColor(t);
    const x=x0,y=y0-Math.sin(rp*Math.PI)*TH*0.6; if(rp<1)anyReveal=true;
    if(h>0){cx.fillStyle=shade(col,-35);cx.beginPath();cx.moveTo(x-TW/2,y);cx.lineTo(x,y+TH/2);cx.lineTo(x,y+TH/2+h);cx.lineTo(x-TW/2,y+h);cx.closePath();cx.fill();
    cx.fillStyle=shade(col,-60);cx.beginPath();cx.moveTo(x+TW/2,y);cx.lineTo(x,y+TH/2);cx.lineTo(x,y+TH/2+h);cx.lineTo(x+TW/2,y+h);cx.closePath();cx.fill();}
    cx.fillStyle=col;cx.beginPath();cx.moveTo(x,y-TH/2);cx.lineTo(x+TW/2,y);cx.lineTo(x,y+TH/2);cx.lineTo(x-TW/2,y);cx.closePath();cx.fill();
    cx.strokeStyle=isMine(t)?'#bdf5c9':isTheirs(t)?'#ffd0c6':(lock?'#ffffff12':'#00000033');cx.lineWidth=t.owner?(t.type==='biz'?3:2):1;cx.stroke();
    if(S.trend&&t.good===S.trend&&t.owner&&!lock){cx.strokeStyle='#fff';cx.lineWidth=1;cx.setLineDash([3,3]);cx.stroke();cx.setLineDash([]);}
    let ic='';if(t.type==='wh')ic='🏬';else if(t.type==='hospital')ic='🏥';else if(t.type==='chance')ic='👊';else if(t.type==='luck')ic='🎲';else if(t.type==='mini')ic='🎰';else if(t.type==='police')ic='🚔';else if(t.type==='pot')ic='👵';else if(t.type==='scatter')ic='🚚';
    else if(t.type==='biz')ic=bizIcon(t);else ic=good(t.good).icon;
    const mine=t.owner&&!lock, theirs=isTheirs(t), isK=t.type==='kiosk', isB=t.type==='biz';
    const iy=lock?y-TH*0.02:mine?y-TH*0.08:y-TH*0.02;
    cx.globalAlpha=lock?0.28:1;
    cx.font=`${Math.round(TW*(lock?0.28:0.34))}px sans-serif`;cx.textAlign='center';cx.textBaseline='middle';cx.fillText(ic,x,iy);
    cx.globalAlpha=1;
    if(t.drop){const d=t.drop;
      if(d.cash>0){drawCoins(x+TW*0.18,y-TH*0.05,coinTier(d.cash));}
      else{const dic=d.rolls?'🎲':d.hard?'$':'⚠️';cx.font=`${Math.round(TW*0.3)}px sans-serif`;cx.textAlign='center';cx.textBaseline='middle';cx.fillText(dic,x+TW*0.2,y-TH*0.3);
        if(d.rolls)outlined(x+TW*0.2,y-TH*0.02,'+'+d.rolls,'#f2b632',TW*0.15);}}
    if(lock)continue;
    if(mine){
      // остаток товара — кольцо вокруг иконки; пусто — красное и клетка пульсирует
      if(isK){const pc=Math.max(0,Math.min(1,t.goods/cap(t))),R=TW*0.20;cx.lineWidth=TW*0.035;cx.strokeStyle='#0006';cx.beginPath();cx.arc(x,iy,R,0,Math.PI*2);cx.stroke();
        if(pc>0){cx.strokeStyle=pc>=0.3?'#3f8f4a':'#f2b632';cx.beginPath();cx.arc(x,iy,R,-Math.PI/2,-Math.PI/2+Math.PI*2*pc);cx.stroke();}
        else{anyEmpty=true;cx.strokeStyle='#d64541';cx.beginPath();cx.arc(x,iy,R,0,Math.PI*2);cx.stroke();
          cx.globalAlpha=0.4+0.6*(0.5+0.5*Math.sin(now/160));cx.strokeStyle='#d64541';cx.lineWidth=2;cx.beginPath();cx.moveTo(x,y-TH/2);cx.lineTo(x+TW/2,y);cx.lineTo(x,y+TH/2);cx.lineTo(x-TW/2,y);cx.closePath();cx.stroke();cx.globalAlpha=1;}}
      // уровень — пипсы фиксированной ширины на нижней кромке
      if(TW>=64){const mx=isB?(t.cfg?t.cfg.upg:21):5,lv=Math.min(mx,klevel(t)),step=TW*0.075,r=TW*0.028,py=y+TH*0.26,x0=x-(mx-1)*step/2;
        for(let k=0;k<mx;k++){cx.beginPath();cx.arc(x0+k*step,py,r,0,Math.PI*2);if(k<lv){cx.fillStyle='#f2b632';cx.fill();}else{cx.lineWidth=1;cx.strokeStyle='#f2b63266';cx.stroke();}}}
      const row=[];if((t.tier||1)>1)row.push({t:['','II','III'][t.tier-1],fg:'#f2b632',sz:TW*0.12,bg:'#2b2723'});
      if(isB)row.push({t:'₽'+fee(t),fg:'#3f8f4a',sz:TW*0.14,bg:'#f1e9d2'});
      if(S.trend&&t.good===S.trend)row.push({t:'×'+CFG.TREND_MULT,fg:'#f1e9d2',sz:TW*0.12,bg:'#d64541'});
      if(row.length)labelRow(x,y-TH*0.66,row);
    }
    // цена свободной точки на поле не выводится — как в коре, смотри в карточке
